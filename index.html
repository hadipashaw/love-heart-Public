\<!DOCTYPE html>
<html lang="en">

</style>

<body>
<div id="chrome" aria-hidden="true">
  <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 12C2 6 6 2 12 2C12 6 10 10 6 12C4 13 2 13 2 12Z" fill="none" stroke="#3A4A5C" stroke-width="1"/></svg>
  <div class="mintitle">Love Heart</div>
  <div class="minbtn"></div>
</div>
<canvas id="c" role="img" aria-label="A heart made of the words I love you in twenty languages"></canvas>
<noscript><div>&#10084;</div></noscript>
<script>
(function(){
"use strict";

/* ===================== Tunable constants ===================== */
const CFG = {
  SEED: 1337,                 // fixed layout seed (press R to re-roll)
  SPEED: 1.0,                 // 1.0 = reference timing; e.g. 1.6 = slower/cinematic
  SHOW_WINDOW_CHROME: false,  // faux Windows 11 Tkinter title bar
  ROW_PITCH_FRAC: 0.0312, JITTER_FRAC: 0.0032, PAD_FRAC: 0.004,
  GAP_MIN_FRAC: 0.013, GAP_MAX_FRAC: 0.039, JUSTIFY_MAX_EXTRA_FRAC: 0.02,
  SIZE_FRACS: { small:0.0185, medium:0.0235, large:0.0300 },
  SIZE_PROBS: { small:0.45, medium:0.35, large:0.20 },
  WEIGHTS: { small:600, medium:700, large:800 },
  MIN_FONT_PX: 9,
  OUTLINE_START_MS: 250, OUTLINE_DUR_MS: 1100, OUTLINE_FADE_MS: 160,
  FILL_START_MS: 1250, FILL_DUR_MS: 1750, FILL_ROW_WINDOW_MS: 260, FILL_FADE_MS: 260,
  SETTLE_MS_NORMAL: 650, SETTLE_MS_FLASH: 900,
  HOT_STRENGTH_NORMAL: 0.55, HOT_STRENGTH_FLASH: 1.0, HOT_STRENGTH_HILITE: 0.0,
  HILITE_SHARE: 0.05, FLASH_SHARE: 0.08,
  BREATH_PERIOD_MS: 5600, TWINKLE_MIN_MS: 900, TWINKLE_MAX_MS: 1800,
  BREATH_WAVE_PERIOD_MS: 2600, // Matrix-style top-to-bottom sweep, one pass per period
  BREATH_WAVE_WIDTH: 0.16,     // softness of the travelling band (fraction of heart height)
  BREATH_WAVE_STRENGTH: 0.30   // extra brightness added at the band's center
};

const COLORS = {
  base:"#F2483E", bright:"#FF6A60", deep:"#D93A33",
  ghost:"#E0B0B6", flashHot:"#FFC9C2", hilite:"#FF8F84"
};

const FONT_STACK = "'Inter','Segoe UI','Noto Sans','Noto Sans JP','Noto Sans SC','Noto Sans KR','Noto Sans Thai','Noto Sans Devanagari',system-ui,sans-serif";

const PHRASES = [
  {text:"I love you", w:2}, {text:"Ich liebe dich", w:4}, {text:"Je t'aime", w:3},
  {text:"Ti amo", w:5}, {text:"Te amo", w:5}, {text:"Eu te amo", w:3},
  {text:"Jag älskar dig", w:2}, {text:"Ik hou van jou", w:3}, {text:"Seni seviyorum", w:4},
  {text:"Σ' αγαπώ", w:3}, {text:"Я тебя люблю", w:3}, {text:"Я тебе кохаю", w:2},
  {text:"Aku cinta kamu", w:3}, {text:"Kocham cię", w:3}, {text:"Anh yêu em", w:4},
  {text:"愛してる", w:3}, {text:"我爱你", w:3}, {text:"사랑해", w:5},
  {text:"ฉันรักเธอ", w:3}, {text:"मैं तुमसे प्यार करता हूँ", w:2}
];
const PHRASE_TOTAL_W = PHRASES.reduce((s,p)=>s+p.w,0);

/* ===================== Seeded PRNG (mulberry32) ===================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ===================== Heart curve ===================== */
function heartXY(t){
  const x = 16*Math.pow(Math.sin(t),3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return [x,y];
}
let RAW_SAMPLES = [], RAW_BBOX = null;
function initRawCurve(){
  const N = 720;
  RAW_SAMPLES = [];
  for(let i=0;i<N;i++) RAW_SAMPLES.push(heartXY((i/N)*Math.PI*2));
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const [x,y] of RAW_SAMPLES){
    if(x<minX)minX=x; if(x>maxX)maxX=x;
    if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  RAW_BBOX = {w:maxX-minX, h:maxY-minY, midX:(minX+maxX)/2, midY:(minY+maxY)/2};
}
function mapGeom(W,H,cx,cy){
  const scaleY = H/RAW_BBOX.h;
  return {scaleX: scaleY*1.10, scaleY, cx, cy};
}
function toScreen(mx,my,g){
  return [g.cx+(mx-RAW_BBOX.midX)*g.scaleX, g.cy-(my-RAW_BBOX.midY)*g.scaleY];
}

/* ===================== Polygon geometry ===================== */
function rowSegments(y, poly){
  const xs=[];
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][1], yj=poly[j][1];
    if((yi<=y && yj>y) || (yj<=y && yi>y)){
      const xi=poly[i][0], xj=poly[j][0];
      xs.push(xi + (y-yi)/(yj-yi)*(xj-xi));
    }
  }
  xs.sort((a,b)=>a-b);
  const segs=[];
  for(let k=0;k+1<xs.length;k+=2) segs.push([xs[k],xs[k+1]]);
  return segs;
}

/* ===================== Weighted picks ===================== */
function pickSize(rand){
  const r = rand();
  if(r < CFG.SIZE_PROBS.small) return 'small';
  if(r < CFG.SIZE_PROBS.small+CFG.SIZE_PROBS.medium) return 'medium';
  return 'large';
}
function pickPhrase(rand, avoidText){
  for(let a=0;a<6;a++){
    let r = rand()*PHRASE_TOTAL_W, chosen = PHRASES[PHRASES.length-1];
    for(const p of PHRASES){ if(r<p.w){ chosen=p; break; } r-=p.w; }
    if(chosen.text !== avoidText) return chosen;
  }
  return PHRASES[0];
}
function shuffleInPlace(arr, rand){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

/* ===================== Layout builder ===================== */
function makeWordRecord(text,sizeKey,fontPx,width,x,y,row,seg){
  return {text,sizeKey,fontPx,width,x,y,row,seg,outline:false,t:0};
}
function buildLayout(ctx, W, bboxY, poly, rand){
  const rowPitch = CFG.ROW_PITCH_FRAC*W, jitter = CFG.JITTER_FRAC*W;
  const padding = CFG.PAD_FRAC*W, padW = CFG.PAD_FRAC*W;
  const gapMin = CFG.GAP_MIN_FRAC*W, gapMax = CFG.GAP_MAX_FRAC*W;
  const rows=[], words=[];
  let rowIndex=0;
  for(let y=bboxY.minY+rowPitch*0.5; y<bboxY.maxY; y+=rowPitch, rowIndex++){
    const segs = rowSegments(y, poly);
    const rowWords=[];
    segs.forEach((seg, segIdx)=>{
      const segL = seg[0]+padding, segR = seg[1]-padding;
      if(segR-segL < 10) return;
      let cursor = segL, lastPhrase = null;
      const placed = [];
      let guard = 0;
      while(cursor < segR && guard < 80){
        guard++;
        // Try several different phrase/size candidates for this slot before giving up —
        // a single long phrase not fitting shouldn't close out a segment that still has
        // room for a shorter one; this is what keeps rows packed instead of trailing off
        // into premature empty space.
        let placedWord = null;
        for(let attempt=0; attempt<8 && !placedWord; attempt++){
          let sizeKey = attempt < 3 ? pickSize(rand) : 'small';
          const phrase = pickPhrase(rand, lastPhrase);
          let fontPx = Math.max(CFG.MIN_FONT_PX, CFG.SIZE_FRACS[sizeKey]*W);
          ctx.font = `${CFG.WEIGHTS[sizeKey]} ${fontPx}px ${FONT_STACK}`;
          let tw = ctx.measureText(phrase.text).width;
          let wordRight = cursor+tw;
          // The segment bounds [segL, segR] are already the true heart boundary at this
          // row's scanline (re-derived fresh for every row), so testing containment
          // against them is the correctness check step 4 asks for; with ~26 finely
          // spaced rows there is no meaningful extra curvature within one row's height.
          let ok = wordRight<=segR;
          if(!ok){
            const fallback = sizeKey==='large' ? ['medium','small'] : (sizeKey==='medium' ? ['small'] : []);
            for(const sk of fallback){
              const fp2 = Math.max(CFG.MIN_FONT_PX, CFG.SIZE_FRACS[sk]*W);
              ctx.font = `${CFG.WEIGHTS[sk]} ${fp2}px ${FONT_STACK}`;
              const tw2 = ctx.measureText(phrase.text).width;
              const wr2 = cursor+tw2;
              if(wr2<=segR){ sizeKey=sk; fontPx=fp2; tw=tw2; wordRight=wr2; ok=true; break; }
            }
          }
          if(ok) placedWord = {phrase, sizeKey, fontPx, tw, wordRight};
        }
        if(!placedWord) break;
        const { phrase, sizeKey, fontPx, tw, wordRight } = placedWord;
        const collide = placed.some(pw => !(wordRight+padW < pw.x || cursor-padW > pw.x+pw.width));
        if(collide) break;
        placed.push(makeWordRecord(phrase.text, sizeKey, fontPx, tw, cursor, y, rowIndex, segIdx));
        cursor = wordRight + (gapMin + rand()*(gapMax-gapMin));
        lastPhrase = phrase.text;
      }
      if(placed.length){
        const last = placed[placed.length-1];
        const leftover = segR - (last.x+last.width);
        if(leftover > 0){
          const gaps = placed.length-1;
          const maxExtraTotal = gaps*CFG.JUSTIFY_MAX_EXTRA_FRAC*W;
          const extraPerGap = gaps>0 ? Math.min(leftover, maxExtraTotal)/gaps : 0;
          const used = extraPerGap*gaps;
          let shift = (leftover-used)/2;
          placed.forEach((wd,idx)=>{ wd.x += shift; if(idx<gaps) shift += extraPerGap; });
        }
      }
      placed.forEach(wd=>{ wd.y += (rand()*2-1)*jitter; rowWords.push(wd); words.push(wd); });
    });
    rows.push({y, index: rowIndex, segCount: segs.length, words: rowWords});
  }
  return {rows, words};
}

function classify(layout){
  const lobeRows = layout.rows.filter(r=>r.segCount===2);
  const topLobeIndex = lobeRows.length ? Math.min(...lobeRows.map(r=>r.index)) : -1;
  const maxRowIndex = layout.rows.length ? Math.max(...layout.rows.map(r=>r.index)) : 0;
  const tipRows = new Set([maxRowIndex, maxRowIndex-1]);
  const segGroups = new Map();
  layout.words.forEach(w=>{
    const key = w.row+'_'+w.seg;
    if(!segGroups.has(key)) segGroups.set(key, []);
    segGroups.get(key).push(w);
  });
  segGroups.forEach(arr=>{
    arr.sort((a,b)=>a.x-b.x);
    arr[0].outline = true;
    arr[arr.length-1].outline = true;
  });
  layout.words.forEach(w=>{
    if(w.row===topLobeIndex) w.outline = true;
    if(tipRows.has(w.row)) w.outline = true;
  });
}

function assignCurveParam(words, poly){
  words.filter(w=>w.outline).forEach(w=>{
    const cx = w.x+w.width/2, cy = w.y;
    let best = Infinity, bestI = 0;
    for(let i=0;i<poly.length;i++){
      const dx = poly[i][0]-cx, dy = poly[i][1]-cy, d = dx*dx+dy*dy;
      if(d<best){ best=d; bestI=i; }
    }
    w.t = bestI;
  });
}

function assignStyle(words, rand){
  words.forEach(w=>{
    const r = rand();
    w.type = r < CFG.HILITE_SHARE ? 'hilite' : (r < CFG.HILITE_SHARE+CFG.FLASH_SHARE ? 'flash' : 'normal');
    w.hotStrength = w.type==='flash' ? CFG.HOT_STRENGTH_FLASH : (w.type==='hilite' ? CFG.HOT_STRENGTH_HILITE : CFG.HOT_STRENGTH_NORMAL);
    w.settleMs = w.type==='flash' ? CFG.SETTLE_MS_FLASH : CFG.SETTLE_MS_NORMAL;
    const cr = rand();
    w.shade = cr<0.5 ? 'base' : (cr<0.75 ? 'bright' : 'deep');
  });
}

/* ===================== Sprite pre-rendering ===================== */
let DPR = 1;
function renderSprite(text, fontPx, weight, fillColor, glowColor, glowBlur){
  const pad = glowBlur*2+4;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `${weight} ${fontPx}px ${FONT_STACK}`;
  const tw = probe.measureText(text).width;
  const w = Math.max(1, Math.ceil(tw)+pad*2);
  const h = Math.max(1, Math.ceil(fontPx*1.6)+pad*2);
  const off = document.createElement('canvas');
  off.width = Math.ceil(w*DPR); off.height = Math.ceil(h*DPR);
  const octx = off.getContext('2d');
  octx.scale(DPR,DPR);
  octx.font = `${weight} ${fontPx}px ${FONT_STACK}`;
  octx.textBaseline = 'middle';
  octx.textAlign = 'left';
  octx.shadowColor = glowColor;
  octx.shadowBlur = glowBlur;
  octx.fillStyle = fillColor;
  octx.fillText(text, pad, h/2);
  octx.fillText(text, pad, h/2);
  return {canvas: off, w, h, pad};
}
function buildSprites(w){
  const weight = w.type==='hilite' ? 800 : CFG.WEIGHTS[w.sizeKey];
  const settledColor = w.type==='hilite' ? COLORS.hilite : COLORS[w.shade];
  w.settledSprite = renderSprite(w.text, w.fontPx, weight, settledColor, 'rgba(255,40,30,0.65)', Math.max(3,w.fontPx*0.28));
  const hotColor = w.type==='flash' ? COLORS.flashHot : COLORS.ghost;
  const hotBlur = w.type==='flash' ? Math.max(4,w.fontPx*0.45) : Math.max(3,w.fontPx*0.32);
  w.hotSprite = renderSprite(w.text, w.fontPx, weight, hotColor, 'rgba(255,120,120,0.5)', hotBlur);
}

/* ===================== Scheduling ===================== */
function schedule(layout, rand){
  const outlineWords = layout.words.filter(w=>w.outline).sort((a,b)=>a.t-b.t);
  const interiorWords = layout.words.filter(w=>!w.outline);
  const rowsMap = new Map();
  interiorWords.forEach(w=>{
    if(!rowsMap.has(w.row)) rowsMap.set(w.row, []);
    rowsMap.get(w.row).push(w);
  });
  const rowIndices = Array.from(rowsMap.keys()).sort((a,b)=>a-b);
  const rowCount = Math.max(1, rowIndices.length);
  const n = Math.max(1, outlineWords.length);
  outlineWords.forEach((w,i)=>{
    w.start = CFG.OUTLINE_START_MS + i*(CFG.OUTLINE_DUR_MS/n) + (rand()*8-4);
    w.fade = CFG.OUTLINE_FADE_MS;
  });
  rowIndices.forEach((ri, idx)=>{
    const windowStart = CFG.FILL_START_MS + (idx/rowCount)*(CFG.FILL_DUR_MS - CFG.FILL_ROW_WINDOW_MS);
    const arr = rowsMap.get(ri);
    shuffleInPlace(arr, rand);
    arr.forEach(w=>{
      w.start = windowStart + rand()*CFG.FILL_ROW_WINDOW_MS;
      w.fade = CFG.FILL_FADE_MS;
    });
  });
  let maxEnd = 0;
  layout.words.forEach(w=>{ maxEnd = Math.max(maxEnd, w.start+w.fade+w.settleMs); });
  return maxEnd;
}

/* ===================== Easing ===================== */
function easeInOutSine(t){ return 0.5-0.5*Math.cos(Math.PI*t); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function clamp01(x){ return x<0?0:(x>1?1:x); }

/* ===================== Canvas / state ===================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed = CFG.SEED;
let current = null;
let t0 = null;
let introPlaying = true;
let hiddenAt = null;
let nextTwinkleAt = 0;

function setupCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w*DPR);
  canvas.height = Math.round(h*DPR);
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function computeGeometry(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const W = Math.min(vw*0.92, 1.22*vh*0.80, 1100);
  const H = W/1.22;
  return { W, H, cx: vw/2, cy: vh/2 - vh*0.015 };
}

function rebuildAll(sd){
  const rand = mulberry32(sd);
  const { W, H, cx, cy } = computeGeometry();
  const g = mapGeom(W, H, cx, cy);
  const poly = RAW_SAMPLES.map(p => toScreen(p[0], p[1], g));
  let minY=Infinity, maxY=-Infinity;
  for(const p of poly){ if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; }
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const layout = buildLayout(ctx, W, {minY,maxY}, poly, rand);
  layout.words.forEach(w=>{ w.normY = (w.y-minY)/Math.max(1,(maxY-minY)); });
  classify(layout);
  assignCurveParam(layout.words, poly);
  assignStyle(layout.words, rand);
  layout.words.forEach(buildSprites);
  const maxEndTime = schedule(layout, rand);
  return { layout, poly, W, H, cx, cy, maxEndTime };
}

/* ===================== Render loop ===================== */
function hotFactor(w, t){
  const su = clamp01((t-w.start)/w.settleMs);
  let hot = t>=w.start ? 1-easeOutCubic(su) : 0;
  if(w.twinkleAt != null){
    const su2 = clamp01((t-w.twinkleAt)/w.settleMs);
    const hot2 = t>=w.twinkleAt ? 1-easeOutCubic(su2) : 0;
    hot = Math.max(hot, hot2);
    if(su2>=1) w.twinkleAt = null;
  }
  return hot;
}
// Matrix-style idle breathing: a soft band of extra brightness travels from the
// top of the heart (normY=0) to the tip (normY=1) and snaps back, looping — layered
// on top of (combined with) the slow global pulse rather than replacing it.
function waveFactor(t, normY){
  const pos = (t % CFG.BREATH_WAVE_PERIOD_MS) / CFG.BREATH_WAVE_PERIOD_MS;
  const d = normY-pos;
  return Math.exp(-(d*d)/(2*CFG.BREATH_WAVE_WIDTH*CFG.BREATH_WAVE_WIDTH));
}
function drawAmbient(t, breath){
  if(!current) return;
  const { cx, cy, W } = current;
  const r = 0.75*W;
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0, `rgba(255,30,30,${(0.045*breath).toFixed(4)})`);
  grad.addColorStop(1, 'rgba(255,30,30,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
}
function drawWords(t, baseBreath, waveActive){
  let allDone = true;
  for(const w of current.layout.words){
    const u = (t-w.start)/w.fade;
    if(u < 0){ allDone = false; continue; }
    const alpha = easeInOutSine(clamp01(u));
    const hot = hotFactor(w, t);
    if(t < w.start+w.fade+w.settleMs) allDone = false;
    if(alpha <= 0) continue;
    const breath = (waveActive && !reducedMotion)
      ? baseBreath*(1+waveFactor(t,w.normY)*CFG.BREATH_WAVE_STRENGTH)
      : baseBreath;
    ctx.globalAlpha = alpha*breath;
    ctx.drawImage(w.settledSprite.canvas, w.x-w.settledSprite.pad, w.y-w.settledSprite.h/2, w.settledSprite.w, w.settledSprite.h);
    if(hot > 0 && w.hotStrength > 0){
      ctx.globalAlpha = alpha*hot*w.hotStrength*breath;
      ctx.drawImage(w.hotSprite.canvas, w.x-w.hotSprite.pad, w.y-w.hotSprite.h/2, w.hotSprite.w, w.hotSprite.h);
    }
  }
  ctx.globalAlpha = 1;
  return allDone;
}
function handleTwinkle(t){
  // Keep the completed heart stable: no random per-word flicker after the intro.
  // The whole heart continues its smooth breathing animation instead.
  return;
}
function frame(now){
  if(t0 === null) t0 = now;
  const t = (now-t0)*CFG.SPEED;
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  const baseBreath = reducedMotion ? 1 : (0.92+0.08*(0.5-0.5*Math.cos(2*Math.PI*(t/CFG.BREATH_PERIOD_MS))));
  drawAmbient(t, baseBreath);
  const allDone = drawWords(t, baseBreath, !introPlaying);
  if(allDone) introPlaying = false;
  handleTwinkle(t);
  requestAnimationFrame(frame);
}

/* ===================== Events ===================== */
function debounce(fn, ms){
  let h;
  return (...args)=>{ clearTimeout(h); h = setTimeout(()=>fn(...args), ms); };
}
function jumpToCompleted(){
  t0 = performance.now() - (current.maxEndTime + 50);
  introPlaying = false;
}
function onResize(){
  setupCanvas();
  current = rebuildAll(seed);
  jumpToCompleted();
}
function onReplay(){
  if(!current) return;
  t0 = performance.now();
  introPlaying = true;
  current.layout.words.forEach(w=>{ w.twinkleAt = null; });
}
function onReseed(){
  seed = Math.floor(Math.random()*1e9);
  current = rebuildAll(seed);
  t0 = performance.now();
  introPlaying = true;
}
function attachEvents(){
  window.addEventListener('resize', debounce(onResize,150));
  window.addEventListener('orientationchange', debounce(onResize,150));
  window.addEventListener('click', onReplay);
  window.addEventListener('touchend', onReplay, {passive:true});
  window.addEventListener('keydown', e=>{
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); onReplay(); }
    else if(e.key === 'r' || e.key === 'R'){ onReseed(); }
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ hiddenAt = performance.now(); }
    else if(hiddenAt !== null){
      const delta = performance.now()-hiddenAt;
      if(t0 !== null) t0 += delta;
      hiddenAt = null;
    }
  });
}

/* ===================== Init ===================== */
async function init(){
  if(CFG.SHOW_WINDOW_CHROME) document.getElementById('chrome').style.display = 'flex';
  initRawCurve();
  setupCanvas();
  try{
    if(document.fonts && document.fonts.ready){
      await Promise.race([document.fonts.ready, new Promise(res=>setTimeout(res,1500))]);
    }
  }catch(e){}
  current = rebuildAll(seed);
  if(reducedMotion){ jumpToCompleted(); }
  attachEvents();
  requestAnimationFrame(frame);
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>
